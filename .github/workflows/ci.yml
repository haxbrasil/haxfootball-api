name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure room runtime
        run: echo "ROOM_NODE_BINARY=$(command -v node)" >> "$GITHUB_ENV"

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Check OpenAPI spec
        run: bun run openapi:check

      - name: E2E tests
        run: bun run test:e2e

      - name: Internal tests
        run: bun run test:internal

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.ORACLE_SSH_PRIVATE_KEY }}" > ~/.ssh/oracle
          printf '%s\n' "${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/oracle

      - name: Deploy to Oracle
        env:
          ORACLE_SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/oracle -o BatchMode=yes -o StrictHostKeyChecking=yes "$ORACLE_SSH_USER@$ORACLE_SSH_HOST" "DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          export PATH=/home/ubuntu/.nvm/versions/node/v22.20.0/bin:/home/ubuntu/.bun/bin:$PATH

          cd /home/ubuntu/haxfootball-api
          previous_sha="$(git rev-parse HEAD)"
          database_file="/home/ubuntu/haxfootball-api/data/app.sqlite"
          backup_directory="/home/ubuntu/haxfootball-api/data/backups"
          backup_file=""
          services_stopped="false"

          rollback_deploy() {
            exit_code="$?"
            trap - ERR
            echo "Deployment failed; restoring the previous database and source revision" >&2

            if [[ "$services_stopped" == "true" ]]; then
              sudo systemctl stop haxfootball-api-media || true
              sudo systemctl stop haxfootball-api-jobs || true
              sudo systemctl stop haxfootball-api || true
            fi

            if [[ -n "$backup_file" ]]; then
              DATABASE_FILE="$database_file" bun scripts/sqlite-maintenance.ts restore "$backup_file"
            fi

            git reset --hard "$previous_sha"
            bun install --frozen-lockfile
            sudo systemctl start haxfootball-api
            sudo systemctl start haxfootball-api-jobs
            sudo systemctl start haxfootball-api-media
            exit "$exit_code"
          }

          trap rollback_deploy ERR
          git fetch origin main
          git reset --hard "$DEPLOY_SHA"
          bun install --frozen-lockfile

          sudo systemctl stop haxfootball-api-media
          sudo systemctl stop haxfootball-api-jobs
          sudo systemctl stop haxfootball-api
          services_stopped="true"

          backup_file="$(
            DATABASE_FILE="$database_file" \
            DATABASE_BACKUP_DIRECTORY="$backup_directory" \
            DEPLOY_SOURCE_SHA="$previous_sha" \
            bun scripts/sqlite-maintenance.ts backup
          )"

          DATABASE_FILE=/home/ubuntu/haxfootball-api/data/app.sqlite bun run db:migrate
          DATABASE_FILE="$database_file" bun scripts/sqlite-maintenance.ts verify

          sudo systemctl start haxfootball-api
          sudo systemctl start haxfootball-api-jobs
          sudo systemctl start haxfootball-api-media
          systemctl is-active --quiet haxfootball-api
          systemctl is-active --quiet haxfootball-api-jobs
          systemctl is-active --quiet haxfootball-api-media
          curl --retry 10 --retry-delay 3 --retry-all-errors -fsS https://api.bfl.haxbrasil.com/health
          services_stopped="false"
          trap - ERR
          REMOTE

      - name: Verify production health
        run: |
          curl --retry 10 --retry-delay 3 --retry-all-errors -fsS https://api.bfl.haxbrasil.com/health

      - name: Print service logs on failure
        if: failure()
        env:
          ORACLE_SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
        run: |
          ssh -i ~/.ssh/oracle -o BatchMode=yes -o StrictHostKeyChecking=yes "$ORACLE_SSH_USER@$ORACLE_SSH_HOST" <<'REMOTE'
          systemctl status haxfootball-api --no-pager -l || true
          systemctl status haxfootball-api-jobs --no-pager -l || true
          systemctl status haxfootball-api-media --no-pager -l || true
          journalctl -u haxfootball-api -n 120 --no-pager || true
          journalctl -u haxfootball-api-jobs -n 120 --no-pager || true
          journalctl -u haxfootball-api-media -n 120 --no-pager || true
          REMOTE
