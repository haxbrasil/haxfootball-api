components:
  schemas:
    Account:
      properties:
        createdAt:
          type: string
        externalId:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        updatedAt:
          type: string
        uuid:
          format: uuid
          type: string
      required:
        - uuid
        - name
        - externalId
        - role
        - createdAt
        - updatedAt
      type: object
    AccountChampionshipHistory:
      properties:
        account:
          properties:
            name:
              type: string
            uuid:
              format: uuid
              type: string
          required:
            - uuid
            - name
          type: object
        editions:
          items:
            properties:
              awards:
                items:
                  type: string
                type: array
              championshipName:
                type: string
              championshipSlug:
                type: string
              championshipUuid:
                format: uuid
                type: string
              completedAt:
                anyOf:
                  - type: string
                  - type: "null"
                nullable: true
              displayNameSnapshot:
                type: string
              role:
                anyOf:
                  - anyOf:
                      - const: gm
                        type: string
                      - const: player
                        type: string
                  - type: "null"
                nullable: true
              teamName:
                anyOf:
                  - type: string
                  - type: "null"
                nullable: true
            required:
              - championshipUuid
              - championshipSlug
              - championshipName
              - displayNameSnapshot
              - teamName
              - role
              - awards
              - completedAt
            type: object
          type: array
        totalCount:
          anyOf:
            - default: 0
              format: integer
              type: string
            - type: integer
        truncated:
          type: boolean
      required:
        - account
        - editions
        - totalCount
        - truncated
      type: object
    AddChampionshipCommentBody:
      properties:
        actorAccountUuid:
          format: uuid
          type: string
        body:
          maxLength: 10000
          minLength: 1
          type: string
        commandUuid:
          format: uuid
          type: string
        expectedRevision:
          anyOf:
            - default: 0
              format: integer
              type: string
            - minimum: 0
              type: integer
          minimum: 0
        mentionAccountUuids:
          items:
            format: uuid
            type: string
          maxItems: 50
          type: array
          uniqueItems: true
      required:
        - actorAccountUuid
        - commandUuid
        - expectedRevision
        - body
      type: object
    AddMatchEventBody:
      properties:
        actorPlayerId:
          maxLength: 64
          minLength: 1
          type: string
        domain:
          enum:
            - room
            - game
            - agent
            - system
          type: string
        elapsedSeconds:
          minimum: 0
          type: number
        id:
          format: uuid
          type: string
        occurredAt:
          minLength: 1
          type: string
        playId:
          maxLength: 128
          minLength: 1
          type: string
        producerSequence:
          anyOf:
            - default: 0
              format: integer
              type: string
            - minimum: 1
              type: integer
          minimum: 1
        roomPlayerId:
          anyOf:
            - default: 0
              format: integer
              type: string
            - minimum: 0
              type: integer
          minimum: 0
        scope:
          enum:
            - player
            - team
            - match
          type: string
        sourceState:
          maxLength: 128
          minLength: 1
          type: string
        subjectPlayerId:
          maxLength: 64
          minLength: 1
          type: string
        team:
          enum:
            - spectators
            - red
            - blue
          type: string
        tick:
          minimum: 0
          type: number
        type:
          maxLength: 64
          minLength: 1
          pattern: ^[a-z][a-z0-9-]{0,63}$
          type: string
        value: {}
      required:
        - domain
        - type
        - scope
        - value
      type: object
    AddRoomEventBody:
      properties:
        actorPlayerId:
          maxLength: 64
          minLength: 1
          type: string
        domain:
          enum:
            - room
            - game
            - agent
            - system
          type: string
        elapsedSeconds:
          minimum: 0
          type: number
        matchId:
          maxLength: 8
          minLength: 8
          type: string
        occurredAt:
          minLength: 1
          type: string
        playId:
          maxLength: 128
          minLength: 1
          type: string
        roomPlayerId:
          anyOf:
            - default: 0
              format: integer
              type: string
            - minimum: 0
              type: integer
          minimum: 0
        scope:
          enum:
            - player
            - team
            - match
          type: string
        sourceState:
          maxLength: 128
          minLength: 1
          type: string
        subjectPlayerId:
          maxLength: 64
          minLength: 1
          type: string
        team:
          enum:
            - spectators
            - red
            - blue
          type: string
        tick:
          minimum: 0
          type: number
        type:
          maxLength: 64
          minLength: 1
          pattern: ^[a-z][a-z0-9-]{0,63}$
          type: string
        value: {}
      required:
        - domain
        - type
        - scope
        - value
      type: object
    AddRoomIncidentBody:
      properties:
        commId:
          minLength: 32
          type: string
        kind:
          enum:
            - desync
            - uncaught-exception
            - unhandled-rejection
          type: string
        occurredAt:
          minLength: 1
          type: string
        playerId:
          anyOf:
            - default: 0
              format: integer
              type: string
            - minimum: 0
              type: integer
          minimum: 0
        reason:
          maxLength: 500
          minLength: 1
          type: string
        records:
          items:
            properties:
              at:
                minLength: 1
                type: string
              data: {}
              type:
                maxLength: 128
                minLength: 1
                type: string
            required:
              - at
              - type
              - data
            type: object
          maxItems: 30000
          minItems: 1
          type: array
        snapshot: {}
        tick:
          minimum: 0
          type: number
      required:
        - commId
        - kind
        - occurredAt
        - records
      type: object
    ApplyChampionshipClassificationBody:
      properties:
        actorAccountUuid:
          format: uuid
          type: string
        commandUuid:
          format: uuid
          type: string
        confirmedImpactMatchUuids:
          items:
            format: uuid
            type: string
          maxItems: 500
          type: array
          uniqueItems: true
        expectedRevision:
          anyOf:
            - default: 0
              format: integer
              type: string
            - minimum: 0
              type: integer
          minimum: 0
        expectedStageRevision:
          anyOf:
            - default: 0
              format: integer
              type: string
            - minimum: 0
              type: integer
          minimum: 0
      required:
        - actorAccountUuid
        - commandUuid
        - expectedRevision
        - expectedStageRevision
        - confirmedImpactMatchUuids
      type: object
    ApplyChampionshipHistoricalImportBody:
      properties:
        actorAccountUuid:
          format: uuid
          type: string
        commandUuid:
          format: uuid
          type: string
        expectedRevision:
          anyOf:
            - default: 0
              format: integer
              type: string
            - minimum: 0
              type: integer
          minimum: 0
        reason:
          maxLength: 2000
          minLength: 3
          type: string
      required:
        - actorAccountUuid
        - commandUuid
        - expectedRevision
        - reason
      type: object
    AssociateMatchRecordingBody:
      properties:
        recordingId:
          minLength: 1
          type: string
      required:
        - recordingId
      type: object
    AssociatePlayerAccountBody:
      properties:
        accountUuid:
          format: uuid
          type: string
      required:
        - accountUuid
      type: object
    AttachChampionshipMatchEvidenceBody:
      properties:
        actorAccountUuid:
          format: uuid
          type: string
        commandUuid:
          format: uuid
          type: string
        composition:
          properties:
            rounds:
              items:
                anyOf:
                  - properties:
                      kind:
                        const: sequential
                        type: string
                      matchId:
                        anyOf:
                          - maxLength: 8
                            minLength: 8
                            pattern: ^[a-z2-9]{8}$
                            type: string
                          - maxLength: 9
                            minLength: 9
                            pattern: ^c[a-z2-9]{8}$
                            type: string
                      number:
                        anyOf:
                          - default: 0
                            format: integer
                            type: string
                          - minimum: 1
                            type: integer
                        minimum: 1
                      orientation:
                        anyOf:
                          - const: auto
                            type: string
                          - const: aligned
                            type: string
                          - const: swapped
                            type: string
                    required:
                      - kind
                      - number
                      - matchId
                    type: object
                  - properties:
                      kind:
                        const: extra-time
                        type: string
                      matchId:
                        anyOf:
                          - maxLength: 8
                            minLength: 8
                            pattern: ^[a-z2-9]{8}$
                            type: string
                          - maxLength: 9
                            minLength: 9
                            pattern: ^c[a-z2-9]{8}$
                            type: string
                      number:
                        type: "null"
                      orientation:
                        anyOf:
                          - const: auto
                            type: string
                          - const: aligned
                            type: string
                          - const: swapped
                            type: string
                    required:
                      - kind
                      - number
                      - matchId
                    type: object
              maxItems: 10
              minItems: 2
              type: array
          required:
            - rounds
          type: object
        expectedEvidenceRevision:
          anyOf:
            - default: 0
              format: integer
              type: string
            - minimum: 0
              type: integer
          minimum: 0
        expectedRevision:
          anyOf:
            - default: 0
              format: integer
              type: string
            - minimum: 0
              type: integer
          minimum: 0
        logicalMatchId:
          anyOf:
            - maxLength: 8
              minLength: 8
              pattern: ^[a-z2-9]{8}$
              type: string
            - maxLength: 9
              minLength: 9
              pattern: ^c[a-z2-9]{8}$
              type: string
        note:
          anyOf:
            - maxLength: 2000
              type: string
            - type: "null"
        orientation:
          enum:
            - aligned
            - swapped
          type: string
      required:
        - actorAccountUuid
        - commandUuid
        - expectedRevision
        - expectedEvidenceRevision
        - orientation
      type: object
    AuthorizeChampionshipLatePlayBody:
      properties:
        actorAccountUuid:
          format: uuid
          type: string
        commandUuid:
          format: uuid
          type: string
        expectedMatchScheduleRevision:
          anyOf:
            - default: 0
              format: integer
              type: string
            - minimum: 0
              type: integer
          minimum: 0
        expectedRevision:
          anyOf:
            - default: 0
              format: integer
              type: string
            - minimum: 0
              type: integer
          minimum: 0
        expiresAt:
          anyOf:
            - format: date-time
              type: string
            - type: "null"
        reason:
          maxLength: 1000
          minLength: 1
          type: string
      required:
        - actorAccountUuid
        - commandUuid
        - expectedRevision
        - expectedMatchScheduleRevision
        - reason
      type: object
    BadRequestError:
      properties:
        error:
          properties:
            code:
              const: BAD_REQUEST
              type: string
            details: {}
            message:
              type: string
          required:
            - code
            - message
          type: object
      required:
        - error
      type: object
    BadRequestOrValidationError:
      anyOf:
        - $ref: "#/components/schemas/BadRequestError"
        - properties:
            error:
              properties:
                code:
                  const: VALIDATION_ERROR
                  type: string
                details: {}
                message:
                  type: string
              required:
                - code
                - message
              type: object
          required:
            - error
          type: object
    BulkUpsertValuesBody:
      properties:
        values:
          items:
            properties:
              label:
                minLength: 1
                type: string
              language:
                maxLength: 16
                minLength: 2
                pattern: ^[a-z]{2,3}(-[a-z0-9]{2,8})*$
                type: string
              value:
                maxLength: 128
                minLength: 1
                pattern: ^[a-z][a-z0-9.-]{0,127}$
                type: string
            required:
              - value
              - language
              - label
            type: object
          minItems: 1
          type: array
      required:
        - values
      type: object
    Championship:
      properties:
        changeSequence:
          anyOf:
            - default: 0
              format: integer
              type: string
            - type: integer
        competitionType:
          $ref: "#/components/schemas/ChampionshipCompetitionType"
        completedAt:
          anyOf:
            - type: string
            - type: "null"
          nullable: true
        createdAt:
          type: string
        description:
          anyOf:
            - type: string
            - type: "null"
          nullable: true
        editionLabel:
          anyOf:
            - type: string
            - type: "null"
          nullable: true
        endsAt:
          anyOf:
            - type: string
            - type: "null"
          nullable: true
        historical:
          type: boolean
        lifecycle:
          enum:
            - setup
            - active
            - completed
            - archived
            - canceled
          type: string
        name:
          type: string
        priceState:
          enum:
            - disabled
            - editable
            - locked
          type: string
        publishedAt:
          anyOf:
            - type: string
            - type: "null"
          nullable: true
        registrationState:
          enum:
            - not-open
            - open
            - closed
          type: string
        revision:
          anyOf:
            - default: 0
              format: integer
              type: string
            - type: integer
        slug:
          type: string
        startsAt:
          anyOf:
            - type: string
            - type: "null"
          nullable: true
        updatedAt:
          type: string
        uuid:
          format: uuid
          type: string
        visibility:
          enum:
            - private
            - public
          type: string
      required:
        - uuid
        - slug
        - competitionType
        - name
        - editionLabel
        - description
        - lifecycle
        - visibility
        - registrationState
        - priceState
        - historical
        - revision
        - changeSequence
        - startsAt
        - endsAt
        - publishedAt
        - completedAt
        - createdAt
        - updatedAt
      type: object
    ChampionshipAssignment:
      properties:
        assignedBy:
          properties:
            accountUuid:
              format: uuid
              type: string
            name:
              type: string
          required:
            - accountUuid
            - name
          type: object
        assignee:
          properties:
            accountUuid:
              format: uuid
              type: string
            name:
              type: string
          required:
            - accountUuid
            - name
          type: object
        completedAt:
          anyOf:
            - type: string
            - type: "null"
          nullable: true
        contextType:
          type: string
        contextUuid:
          anyOf:
            - type: string
            - type: "null"
          nullable: true
        createdAt:
          type: string
        description:
          anyOf:
            - type: string
            - type: "null"
          nullable: true
        dueAt:
          anyOf:
            - type: string
            - type: "null"
          nullable: true
        revision:
          anyOf:
            - default: 0
              format: integer
              type: string
            - type: integer
        state:
          enum:
            - open
            - in-progress
            - completed
            - canceled
          type: string
        title:
          type: string
        updatedAt:
          type: string
        uuid:
          format: uuid
          type: string
      required:
        - uuid
        - contextType
        - contextUuid
        - title
        - description
        - assignee
        - assignedBy
        - state
        - dueAt
        - completedAt
        - revision
        - createdAt
        - updatedAt
      type: object
    ChampionshipAuditEvent:
      properties:
        action:
          type: string
        actor:
          properties:
            accountName:
              anyOf:
                - type: string
                - type: "null"
              nullable: true
            accountUuid:
              anyOf:
                - type: string
                - type: "null"
              nullable: true
            kind:
              type: string
          required:
            - kind
            - accountUuid
            - accountName
          type: object
        after: {}
        before: {}
        commandUuid:
          anyOf:
            - type: string
            - type: "null"
          nullable: true
        correlationUuid:
          format: uuid
          type: string
        createdAt:
          type: string
        metadata: {}
        reason:
          anyOf:
            - type: string
            - type: "null"
          nullable: true
        sequence:
          anyOf:
            - default: 0
              format: integer
              type: string
            - type: integer
        source:
          type: string
        targetType:
          type: string
        targetUuid:
          anyOf:
            - type: string
            - type: "null"
          nullable: true
        uuid:
          format: uuid
          type: string
      required:
        - uuid
        - sequence
        - correlationUuid
        - commandUuid
        - actor
        - action
        - source
        - targetType
        - targetUuid
        - before
        - after
        - reason
        - metadata
        - createdAt
      type: object
    ChampionshipAward:
      properties:
        awardedAt:
          type: string
        displayLabel:
          type: string
        identitySnapshot:
          anyOf:
            - properties:
                name:
                  type: string
                uuid:
                  format: uuid
                  type: string
              required:
                - uuid
                - name
              type: object
            - type: "null"
          nullable: true
        kind:
          type: string
        note:
          anyOf:
            - type: string
            - type: "null"
          nullable: true
        rank:
          anyOf:
            - anyOf:
                - default: 0
                  format: integer
                  type: string
                - type: integer
            - type: "null"
          nullable: true
        target:
          properties:
            type:
              enum:
                - team
                - team-identity
                - participant
                - account
                - historical-player
              type: string
            uuid:
              format: uuid
              type: string
          required:
            - type
            - uuid
          type: object
        uuid:
          format: uuid
          type: string
      required:
        - uuid
        - kind
        - rank
        - target
        - displayLabel
        - note
        - identitySnapshot
        - awardedAt
      type: object
    ChampionshipComment:
      properties:
        author:
          properties:
            accountUuid:
              format: uuid
              type: string
            name:
              type: string
          required:
            - accountUuid
            - name
          type: object
        body:
          type: string
        createdAt:
          type: string
        editedAt:
          anyOf:
            - type: string
            - type: "null"
          nullable: true
        mentions:
          items:
            properties:
              accountUuid:
                format: uuid
                type: string
              name:
                type: string
            required:
              - accountUuid
              - name
            type: object
          type: array
        revision:
          anyOf:
            - default: 0
              format: integer
              type: string
            - type: integer
        threadUuid:
          format: uuid
          type: string
        updatedAt:
          type: string
        uuid:
          format: uuid
          type: string
      required:
        - uuid
        - threadUuid
        - author
        - body
        - mentions
        - revision
        - editedAt
        - createdAt
        - updatedAt
      type: object
    ChampionshipCompetitionType:
      properties:
        cadence:
          anyOf:
            - anyOf:
                - const: long-running
                  type: string
                - const: multi-day
                  type: string
                - const: single-event
                  type: string
            - type: "null"
          nullable: true
        createdAt:
          type: string
        defaultRules:
          properties:
            draft:
              properties:
                countdownSeconds:
                  anyOf:
                    - default: 0
                      format: integer
                      type: string
                    - maximum: 86400
                      minimum: 0
                      type: integer
                  maximum: 86400
                  minimum: 0
                publicPrices:
                  type: boolean
                rounds:
                  anyOf:
                    - default: 0
                      format: integer
                      type: string
                    - maximum: 100
                      minimum: 1
                      type: integer
                  maximum: 100
                  minimum: 1
              required:
                - rounds
                - countdownSeconds
                - publicPrices
              type: object
            match:
              properties:
                drawPolicy:
                  enum:
                    - allowed
                    - overtime
                    - staff-decision
                  type: string
                fullForfeitScore:
                  properties:
                    loser:
                      anyOf:
                        - default: 0
                          format: integer
                          type: string
                        - minimum: 0
                          type: integer
                      minimum: 0
                    winner:
                      anyOf:
                        - default: 0
                          format: integer
                          type: string
                        - minimum: 0
                          type: integer
                      minimum: 0
                  required:
                    - winner
                    - loser
                  type: object
                overtimePolicy:
                  enum:
                    - disabled
                    - separate-period
                    - manual
                  type: string
                overtimeRuleLabel:
                  anyOf:
                    - maxLength: 160
                      type: string
                    - type: "null"
                sequentialRoundCount:
                  anyOf:
                    - default: 0
                      format: integer
                      type: string
                    - maximum: 10
                      minimum: 1
                      type: integer
                  maximum: 10
                  minimum: 1
                switchSides:
                  type: boolean
              required:
                - sequentialRoundCount
                - switchSides
                - drawPolicy
                - overtimePolicy
                - overtimeRuleLabel
                - fullForfeitScore
              type: object
            roster:
              properties:
                lockPolicy:
                  enum:
                    - unlocked
                    - draft-start
                    - competition-start
                  type: string
                maximumSize:
                  anyOf:
                    - default: 0
                      format: integer
                      type: string
                    - minimum: 1
                      type: integer
                  minimum: 1
                minimumSize:
                  anyOf:
                    - default: 0
                      format: integer
                      type: string
                    - minimum: 0
                      type: integer
                  minimum: 0
              required:
                - minimumSize
                - maximumSize
                - lockPolicy
              type: object
            salary:
              properties:
                capUnits:
                  anyOf:
                    - default: 0
                      format: integer
                      type: string
                    - minimum: 0
                      type: integer
                  minimum: 0
                displayLabel:
                  maxLength: 32
                  minLength: 1
                  type: string
                enabled:
                  type: boolean
                maximumTradeDifference:
                  anyOf:
                    - default: 0
                      format: integer
                      type: string
                    - minimum: 0
                      type: integer
                  minimum: 0
              required:
                - enabled
                - capUnits
                - displayLabel
                - maximumTradeDifference
              type: object
            scheduling:
              properties:
                authority:
                  enum:
                    - staff
                    - gms
                    - staff-and-gms
                  type: string
                latePlayPolicy:
                  enum:
                    - forbidden
                    - staff-approval
                    - allowed
                  type: string
                proposalMode:
                  enum:
                    - exact-time
                    - availability-range
                    - both
                  type: string
              required:
                - authority
                - proposalMode
                - latePlayPolicy
              type: object
          required:
            - match
            - roster
            - salary
            - draft
            - scheduling
          type: object
        defaultRulesSchemaVersion:
          anyOf:
            - default: 0
              format: integer
              type: string
            - type: integer
        description:
          anyOf:
            - type: string
            - type: "null"
          nullable: true
        name:
          type: string
        revision:
          anyOf:
            - default: 0
              format: integer
              type: string
            - type: integer
        slug:
          type: string
        state:
          enum:
            - active
            - archived
          type: string
        updatedAt:
          type: string
        uuid:
          format: uuid
          type: string
      required:
        - uuid
        - slug
        - name
        - description
        - cadence
        - defaultRulesSchemaVersion
        - defaultRules
        - state
        - revision
        - createdAt
        - updatedAt
      type: object
    ChampionshipDetail:
      properties:
        changeSequence:
          anyOf:
            - default: 0
              format: integer
              type: string
            - type: integer
        competitionType:
          properties:
            cadence:
              anyOf:
                - anyOf:
                    - const: long-running
                      type: string
                    - const: multi-day
